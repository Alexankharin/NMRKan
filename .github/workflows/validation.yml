name: Reproducibility checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[reproduce]'
      - run: python -m experiments.verify_artifacts
      - run: python -m pytest -q
      - run: python -m experiments.check_notebooks
      - run: python -m experiments.molecules --from-reference
